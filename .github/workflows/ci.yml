name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e

  install-smoke:
    # Runs the real installer against the packed package, in a throwaway HOME.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pack
        run: echo "TGZ=$(pwd)/$(npm pack --silent)" >> "$GITHUB_ENV"
      - name: Install with a fake claude and no service
        run: |
          export HOME="$RUNNER_TEMP/home" SHELL=/bin/bash
          mkdir -p "$HOME" "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "claude $*" >> "$HOME/claude-calls.log"\n' > "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          export PATH="$RUNNER_TEMP/bin:$PATH" NPM_CONFIG_PREFIX="$RUNNER_TEMP/npm"
          AGENTLINK_PKG="$TGZ" AGENTLINK_NO_SERVICE=1 AGENTLINK_DISCOVERY=0 sh install.sh | tee out.txt
          grep -q "Join my agentlink network" out.txt
          grep -q "mcp add -s user agentlink" "$HOME/claude-calls.log"
          "$RUNNER_TEMP/npm/bin/agentlink" status
          "$RUNNER_TEMP/npm/bin/agentlink" send someone "smoke test"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
