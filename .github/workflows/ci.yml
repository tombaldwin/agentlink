name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e

  install-smoke:
    # Runs the real installer against the packed package, in a throwaway HOME.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pack
        run: echo "TGZ=$(pwd)/$(npm pack --silent)" >> "$GITHUB_ENV"
      - name: Install with a fake claude and no service
        run: |
          export HOME="$RUNNER_TEMP/home" SHELL=/bin/bash
          mkdir -p "$HOME" "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "claude $*" >> "$HOME/claude-calls.log"\n' > "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          export PATH="$RUNNER_TEMP/bin:$PATH" NPM_CONFIG_PREFIX="$RUNNER_TEMP/npm"
          AGENTLINK_SKIP_CHECKS=1 AGENTLINK_APP=0 AGENTLINK_PKG="$TGZ" AGENTLINK_NO_SERVICE=1 AGENTLINK_DISCOVERY=0 sh install.sh | tee out.txt
          grep -q "Join my agentlink network" out.txt
          grep -q "mcp add -s user agentlink" "$HOME/claude-calls.log"
          "$RUNNER_TEMP/npm/bin/agentlink" status
          "$RUNNER_TEMP/npm/bin/agentlink" send someone "smoke test"
      - name: Install with the private Node runtime
        # what machines without Node 22.13+ get: the runtime must stay off PATH and the home private
        run: |
          # its own port: the previous step's node (another network) is still running on 7777
          export HOME="$RUNNER_TEMP/home2" SHELL=/bin/bash AGENTLINK_PORT=7778
          mkdir -p "$HOME" "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          AGENTLINK_SKIP_CHECKS=1 AGENTLINK_PRIVATE_NODE=1 AGENTLINK_PKG="$TGZ" AGENTLINK_NO_SERVICE=1 AGENTLINK_DISCOVERY=0 sh install.sh | tee out.txt
          grep -q "Join my agentlink network" out.txt
          test "$(ls -ld "$HOME/.agentlink" | cut -c1-10)" = drwx------
          "$HOME/.agentlink/bin/agentlink" status
          test ! -e "$HOME/.agentlink/bin/node"
          # a new shell (rc written by setup) finds agentlink, but node is still the system one
          bash -c '. ~/.bashrc 2>/dev/null || . ~/.bash_profile; test "$(command -v agentlink)" = "$HOME/.agentlink/bin/agentlink"; test "$(command -v node)" != "$HOME/.agentlink/node/bin/node"'
      - name: Join the first network with its invite line (the stock curl, pinned to the inviter's key)
        run: |
          INVITE=$(HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/npm/bin/agentlink" invite | grep -o 'curl -fsSL -k --pinnedpubkey "[^"]*" "https://[^"]*"' | head -1)
          test -n "$INVITE"
          # the inviter's name may not resolve on a runner: reach it on 127.0.0.1 instead
          INVITE=$(printf '%s' "$INVITE" | sed -E 's#https://[^/]+/#https://127.0.0.1:7777/#')
          export HOME="$RUNNER_TEMP/home3" SHELL=/bin/bash AGENTLINK_PORT=7779 AGENTLINK_HOST=joiner
          mkdir -p "$HOME"
          export PATH="$RUNNER_TEMP/bin:$PATH" NPM_CONFIG_PREFIX="$RUNNER_TEMP/npm3" AGENTLINK_NO_SERVICE=1 AGENTLINK_DISCOVERY=0
          eval "$INVITE" | sh | tee out.txt
          grep -q "Joined the network" out.txt
          "$RUNNER_TEMP/npm3/bin/agentlink" status | grep -q '"host": "joiner.local"'
          # a wrong key is refused before anything is downloaded
          if curl -fsSL -k --pinnedpubkey "sha256//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" "https://127.0.0.1:7777/join/install?t=x"; then
            echo "a wrong pinned key was accepted"; exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
