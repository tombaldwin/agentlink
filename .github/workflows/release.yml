name: Release

# Pushing a tag vX.Y.Z builds agentlink.app (signed with Developer ID, notarized, stapled) and
# creates a DRAFT GitHub Release with it and the npm package. Check the draft, then publish it:
# the installer downloads the app from the latest published release.
# Running the workflow by hand (Actions → Release → Run workflow) does the same build and
# notarization without creating a release: use it to check the signing secrets.
# Setup: docs/releasing.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-app:
    runs-on: macos-latest          # Apple silicon
    timeout-minutes: 45
    steps:
      - run: echo "KEYCHAIN=$RUNNER_TEMP/agentlink-signing.keychain-db" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          V=$(node -p 'require("./package.json").version')
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "tag $GITHUB_REF_NAME doesn't match package.json version $V"; exit 1; }

      - run: npm run typecheck
      - run: npm run test:unit

      - name: Check the signing secrets are set
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=""
          for v in CERT CERT_PW KEY KEY_ID ISSUER; do eval "[ -n \"\$$v\" ]" || missing="$missing $v"; done
          [ -z "$missing" ] || { echo "missing signing secrets (see docs/releasing.md):$missing"; exit 1; }

      - name: Set up a throwaway signing keychain
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KC_PW=$(openssl rand -hex 24)
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          # this keychain first, so codesign and notarytool find the identity and the profile in it
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          umask 077
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials agentlink-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/notary.p8"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Developer ID Application' ||
            { echo "the certificate in MACOS_CERT_P12 is not a Developer ID Application certificate"; exit 1; }

      - name: Build, sign and notarize agentlink.app
        run: npm run build:app -- --sign "Developer ID Application" --notarize agentlink-notary

      - name: Run the end-to-end tests against the built app
        run: AGENTLINK_TEST_EXE=dist/arm64/agentlink.app/Contents/MacOS/agentlink npm run test:e2e

      - name: Release files
        run: |
          V=$(node -p 'require("./package.json").version')
          mkdir -p release
          cp "dist/agentlink-$V-macos-arm64.zip" release/
          cp "dist/agentlink-$V-macos-arm64.zip.sha256" release/
          # unversioned names: what the installer fetches from releases/latest/download
          cp "dist/agentlink-$V-macos-arm64.zip" release/agentlink-macos-arm64.zip
          (cd release && shasum -a 256 agentlink-macos-arm64.zip > agentlink-macos-arm64.zip.sha256)
          npm pack --silent --pack-destination release >/dev/null
          # this version's CHANGELOG section as the release notes
          awk -v v="$V" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > release-notes.md
          ls -l release

      - name: Keep the build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: agentlink-release
          path: release/

      - name: Create a draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --title "agentlink ${GITHUB_REF_NAME#v}" --notes-file release-notes.md

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
