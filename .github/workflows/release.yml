name: Release

# Pushing a tag vX.Y.Z builds nattermatic.app (signed with Developer ID, notarized, stapled) and
# creates a DRAFT GitHub Release with it and the npm package. Check the draft, then publish it:
# the installer downloads the app from the latest published release.
# Publishing that release then publishes the same npm package to npm, through npm's trusted
# publishing (no token: npm trusts this workflow file in this repo), and then lists that version in
# the official MCP Registry (server.json, through GitHub OIDC).
# Running the workflow by hand (Actions → Release → Run workflow) does the same build and
# notarization without creating a release: use it to check the signing secrets.
# Setup: docs/releasing.md.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-app:
    if: github.event_name != 'release'
    runs-on: macos-latest          # Apple silicon
    timeout-minutes: 45
    steps:
      - run: echo "KEYCHAIN=$RUNNER_TEMP/nattermatic-signing.keychain-db" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          V=$(node -p 'require("./package.json").version')
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "tag $GITHUB_REF_NAME doesn't match package.json version $V"; exit 1; }

      - run: npm run typecheck
      - run: npm run test:unit

      - name: Check the signing secrets are set
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=""
          for v in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do eval "[ -n \"\$$v\" ]" || missing="$missing $v"; done
          [ -z "$missing" ] || { echo "missing signing secrets (see docs/releasing.md):$missing"; exit 1; }

      - name: Set up a throwaway signing keychain
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KC_PW=$(openssl rand -hex 24)
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          # this keychain first, so codesign and notarytool find the identity and the profile in it
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          umask 077
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials nattermatic-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/notary.p8"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Developer ID Application' ||
            { echo "the certificate in MACOS_CERT_P12 is not a Developer ID Application certificate"; exit 1; }

      - name: Build, sign and notarize nattermatic.app
        run: npm run build:app -- --sign "Developer ID Application" --notarize nattermatic-notary

      - name: Run the end-to-end tests against the built app
        run: NATTERMATIC_TEST_EXE=dist/arm64/nattermatic.app/Contents/MacOS/nattermatic npm run test:e2e

      - name: Release files
        run: |
          V=$(node -p 'require("./package.json").version')
          mkdir -p release
          cp "dist/nattermatic-$V-macos-arm64.zip" release/
          cp "dist/nattermatic-$V-macos-arm64.zip.sha256" release/
          # unversioned names: what the installer fetches from releases/latest/download
          cp "dist/nattermatic-$V-macos-arm64.zip" release/nattermatic-macos-arm64.zip
          (cd release && shasum -a 256 nattermatic-macos-arm64.zip > nattermatic-macos-arm64.zip.sha256)
          npm pack --silent --pack-destination release >/dev/null
          # this version's CHANGELOG section as the release notes
          awk -v v="$V" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > release-notes.md
          ls -l release

      - name: Keep the build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nattermatic-release
          path: release/

      - name: Create a draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --title "nattermatic ${GITHUB_REF_NAME#v}" --notes-file release-notes.md

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

  npm:
    # the package attached to the release just published, so npm gets exactly what was checked
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write              # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1   # trusted publishing needs 11.5.1 or later
      - name: Publish the release's package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V=${TAG#v}
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "nattermatic-$V.tgz"
          if npm view "nattermatic@$V" version >/dev/null 2>&1; then
            echo "nattermatic@$V is already on npm"; exit 0
          fi
          npm publish "./nattermatic-$V.tgz" --provenance --access public

  mcp-registry:
    # the MCP Registry entry (server.json) for the version just published to npm: the registry checks
    # the package's mcpName against it, so npm comes first. GitHub OIDC proves the io.github.tombaldwin
    # namespace, so there's no token.
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISHER: v1.8.4            # pinned, with its checksum from the release's checksums file
      PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check server.json is for this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V=$(node -p 'require("./server.json").version')
          [ "$TAG" = "v$V" ] || { echo "server.json is for $V, not $TAG"; exit 1; }
      - name: Install mcp-publisher
        run: |
          curl -fsSLo publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
      - name: Wait for npm to serve this version
        # npm takes a minute or so to process a publish, and the registry rejects a version npm
        # doesn't serve yet (0.1.1 failed this way)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for i in $(seq 1 40); do
            curl -fsS "https://registry.npmjs.org/nattermatic/${TAG#v}" >/dev/null 2>&1 && exit 0
            sleep 15
          done
          echo "npm still doesn't serve ${TAG#v} after 10 minutes"; exit 1
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
